<!DOCTYPE html>
<html lang = "es">

<head>
    <meta charset = "UTF-8">
    <title>Mi Habit Tracker</title>
</head>


<body>
    <h1>Mis Habitos Diarios</h1>
    <form action = "/agregar" method = "POST">
        <input type = "text", name = "nombre_habito" placeholder = "Escribi un nuevo habito..." required>
        <button type="submit">Agregar</button>
    </form>
    <ul>
        {% for habito in habitos %}
            <li> 
                {{ habito.nombre }} - Completado: {{ habito.completado}}
                <a href = "/completar/{{ habito.id }}">
                    <button> Completado </button>
                </a>
                <a href = "/eliminar/{{ habito.id }}">
                    <button> Eliminar </button>
                </a>
            </li>
        {% endfor %}
    </ul>

</body>

</html>
